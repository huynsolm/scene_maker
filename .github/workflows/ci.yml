name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Node 버전은 .nvmrc 한 곳에서 관리한다(package.json 의 engines 와 같은 22.x).
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # 영상 렌더링 테스트에 필요하다(libx264, libass 포함 빌드).
      - name: ffmpeg 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Chromium 설치
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
